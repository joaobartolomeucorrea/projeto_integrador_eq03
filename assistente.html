  <button
    id="abrir-assistente"
    type="button"
    aria-label="Abrir assistente Acolhe+"
    aria-expanded="false"
    aria-controls="painel-assistente">

    💛 Acolhe+

</button>

<div id="painel-assistente" hidden>

    <button id="fechar-assistente" type="button">
        ✖ Fechar
    </button>

    <h2>Acolhe+ 💛</h2>

    <p>Olá! Sou o Acolhe+, seu assistente virtual.</p>

    <div id="mensagens-assistente">
        <div class="mensagem bot">
            Olá! 💛 Como posso ajudar você hoje?
        </div>
    </div>

    <form id="form-assistente">

        <input
            type="text"
            id="entrada-assistente"
            placeholder="Digite sua mensagem..."
            required>

        <button type="submit">Enviar</button>

    </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assistente.js"></script>
